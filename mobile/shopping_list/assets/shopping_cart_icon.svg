<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B21B6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Shopping cart body -->
  <rect x="212" y="512" width="600" height="400" rx="40" ry="40" fill="url(#cartGradient)" stroke="#4C1D95" stroke-width="24"/>

  <!-- Shopping cart handle -->
  <rect x="162" y="272" width="700" height="120" rx="60" ry="60" fill="url(#cartGradient)" stroke="#4C1D95" stroke-width="24"/>

  <!-- Shopping cart wheels -->
  <circle cx="312" cy="768" r="56" fill="url(#cartGradient)" stroke="#4C1D95" stroke-width="16"/>
  <circle cx="712" cy="768" r="56" fill="url(#cartGradient)" stroke="#4C1D95" stroke-width="16"/>

  <!-- Shopping cart items -->
  <circle cx="388" cy="512" r="40" fill="url(#cartGradient)" stroke="#4C1D95" stroke-width="12"/>
  <circle cx="636" cy="512" r="40" fill="url(#cartGradient)" stroke="#4C1D95" stroke-width="12"/>
  <circle cx="512" cy="472" r="40" fill="url(#cartGradient)" stroke="#4C1D95" stroke-width="12"/>

  <!-- Highlight effects -->
  <rect x="232" y="532" width="560" height="360" rx="30" ry="30" fill="none" stroke="#A78BFA" stroke-width="8" opacity="0.3"/>
  <rect x="182" y="292" width="660" height="100" rx="50" ry="50" fill="none" stroke="#A78BFA" stroke-width="8" opacity="0.3"/>
</svg>
